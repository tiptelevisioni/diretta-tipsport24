<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DIRETTA</title>
<style>
  :root {
    --accent: #ff3b30;
    --accent-2: #ffb020;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0c;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #player-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    user-select: none;
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
  }
  /* nasconde ogni UI nativa residua su iOS/Safari */
  video::-webkit-media-controls { display: none !important; }
  video::-webkit-media-controls-panel { display: none !important; }

  /* ===== Overlay caricamento / errore ===== */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #f2f2f2;
    text-align: center;
    padding: 20px;
    background: radial-gradient(ellipse at center, #171719 0%, #050506 100%);
    z-index: 10;
    transition: opacity 0.25s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  .logo-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .logo-badge .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .spinner {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #msg { font-size: 14px; opacity: 0.85; max-width: 90%; }

  #retry-btn {
    display: none;
    padding: 10px 26px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 24px;
    cursor: pointer;
  }
  #retry-btn:active { transform: scale(0.96); }

  /* ===== Tap-to-play iniziale ===== */
  #start-gate {
    position: absolute;
    inset: 0;
    z-index: 15;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    cursor: pointer;
  }
  #start-gate .play-circle {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #start-gate:active .play-circle { transform: scale(0.94); background: rgba(255,255,255,0.2); }
  #start-gate svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }

  /* ===== Controlli custom ===== */
  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 12;
    padding: 28px 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 100%);
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
  }
  .ctrl-btn svg {
    width: 24px;
    height: 24px;
    fill: #fff;
  }
  .ctrl-btn:active { opacity: 0.6; }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,59,48,0.18);
    border: 1px solid rgba(255,59,48,0.5);
    padding: 4px 10px 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #ff6b61;
  }
  .live-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .live-pill.buffering .dot {
    background: #888;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .spacer { flex: 1; }

  .vol-wrap {
    display: none;
    align-items: center;
    overflow: hidden;
    width: 0;
    transition: width 0.2s ease;
  }
  .vol-wrap.show { display: flex; width: 70px; }
  #volume-slider {
    width: 70px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  #title-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 11;
    padding: 16px 16px 40px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 1;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #title-overlay.hidden { opacity: 0; }
  #title-overlay .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex-shrink: 0;
  }
  #title-overlay span {
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  @media (max-width: 480px) {
    .ctrl-btn svg { width: 21px; height: 21px; }
    #controls { padding: 22px 8px 10px; }
    .live-pill { font-size: 10px; padding: 3px 8px 3px 6px; }
  }
</style>
</head>
<body>

<div id="player-wrap">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>

  var MAX_RETRIES = 8;
  var RETRY_DELAY_MS = 4000;
  var CONTROLS_HIDE_DELAY = 2800;
  // ================================

  var video        = document.getElementById('video');
  var overlay       = document.getElementById('overlay');
  var msg            = document.getElementById('msg');
  var spinner        = document.getElementById('spinner');
  var retryBtn       = document.getElementById('retry-btn');
  var startGate       = document.getElementById('start-gate');
  var controls        = document.getElementById('controls');
  var titleOverlay     = document.getElementById('title-overlay');
  var playBtn          = document.getElementById('play-btn');
  var playIcon         = document.getElementById('play-icon');
  var pauseIcon        = document.getElementById('pause-icon');
  var muteBtn           = document.getElementById('mute-btn');
  var volOnIcon        = document.getElementById('vol-on-icon');
  var volOffIcon       = document.getElementById('vol-off-icon');
  var volWrap           = document.getElementById('vol-wrap');
  var volumeSlider      = document.getElementById('volume-slider');
  var livePill          = document.getElementById('live-pill');
  var fullscreenBtn     = document.getElementById('fullscreen-btn');
  var fsOpenIcon        = document.getElementById('fs-open-icon');
  var fsCloseIcon       = document.getElementById('fs-close-icon');
  var wrap               = document.getElementById('player-wrap');

  var hls = null;
  var retryCount = 0;
  var retryTimer = null;
  var hideControlsTimer = null;
  var hasStarted = false;

  // ---------- Overlay di stato ----------
  function setMsg(text, showSpinner, showRetry) {
    msg.textContent = text;
    spinner.style.display = showSpinner ? 'block' : 'none';
    retryBtn.style.display = showRetry ? 'inline-block' : 'none';
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ---------- Play / Pause ----------
  function updatePlayIcon() {
    var playing = !video.paused && !video.ended;
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
  }

  function doPlay() {
    var p = video.play();
    if (p && p.then) {
      p.then(function () {
        startGate.style.display = 'none';
      }).catch(function () {
        startGate.style.display = 'flex';
      });
    }
  }

  playBtn.addEventListener('click', function () {
    if (video.paused) { doPlay(); } else { video.pause(); }
  });

  startGate.addEventListener('click', function () {
    video.muted = false;
    volumeSlider.value = video.volume || 1;
    startGate.style.display = 'none';
    hasStarted = true;
    doPlay();
    updateMuteIcon();
  });

  // ---------- Volume / Mute ----------
  function updateMuteIcon() {
    var muted = video.muted || video.volume === 0;
    volOnIcon.style.display = muted ? 'none' : 'block';
    volOffIcon.style.display = muted ? 'block' : 'none';
  }

  muteBtn.addEventListener('click', function () {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) { video.volume = 1; volumeSlider.value = 1; }
    updateMuteIcon();
  });

  volumeSlider.addEventListener('input', function () {
    video.volume = parseFloat(volumeSlider.value);
    video.muted = video.volume === 0;
    updateMuteIcon();
  });

  // mostra lo slider volume al hover/tap su desktop; su touch resta compatto
  muteBtn.addEventListener('mouseenter', function () { volWrap.classList.add('show'); });
  wrap.addEventListener('mouseleave', function () { volWrap.classList.remove('show'); });
  muteBtn.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    volWrap.classList.toggle('show');
  }, { passive: true });

  // ---------- Fullscreen ----------
  function isFullscreen() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }

  fullscreenBtn.addEventListener('click', function () {
    if (!isFullscreen()) {
      if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS Safari fallback
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  function updateFsIcon() {
    var fs = isFullscreen();
    fsOpenIcon.style.display = fs ? 'none' : 'block';
    fsCloseIcon.style.display = fs ? 'block' : 'none';
  }
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);

  // ---------- Auto-hide controlli ----------
  function showControls() {
    controls.classList.remove('hidden');
    titleOverlay.classList.remove('hidden');
    clearTimeout(hideControlsTimer);
    if (!video.paused) {
      hideControlsTimer = setTimeout(function () {
        controls.classList.add('hidden');
        titleOverlay.classList.add('hidden');
      }, CONTROLS_HIDE_DELAY);
    }

  wrap.addEventListener('mousemove', showControls);
  wrap.addEventListener('touchstart', showControls, { passive: true });
  wrap.addEventListener('click', function (e) {
    if (e.target === video) showControls();

  // ---------- Buffering indicator ----------
  var waitingTimer = null;
  video.addEventListener('waiting', function () {
    clearTimeout(waitingTimer);
    waitingTimer = setTimeout(function () {
      livePill.classList.add('buffering');
    }, 500); // evita il lampeggio per micro-buffering di pochi ms
  });
  video.addEventListener('playing', function () {
    clearTimeout(waitingTimer);
    livePill.classList.remove('buffering');
    hideOverlay();
    updatePlayIcon();
    showControls();
  });
  video.addEventListener('pause', function () {
    updatePlayIcon();
    clearTimeout(hideControlsTimer);
    controls.classList.remove('hidden');
    titleOverlay.classList.remove('hidden');
  });
  video.addEventListener('play', updatePlayIcon);
  video.addEventListener('volumechange', updateMuteIcon);

  // ---------- HLS loading & retry ----------
  function scheduleRetry() {
    retryCount++;
    if (retryCount > MAX_RETRIES) {
      setMsg('Diretta non disponibile al momento. Riprova più tardi.', false, true);
      return;
    }
    setMsg('Riconnessione in corso… (' + retryCount + '/' + MAX_RETRIES + ')', true, false);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(startStream, RETRY_DELAY_MS);
  }

  function destroyHls() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  }

  function startStream() {
    setMsg('Caricamento diretta in corso…', true, false);
    destroyHls();

    var canNativeHls = video.canPlayType('application/vnd.apple.mpegurl') ||
                        video.canPlayType('application/x-mpegURL');

    // molto più affidabile della riproduzione via MSE/hls.js su questo browser.

    // Chrome, Firefox, Edge e Android, che non hanno supporto nativo.
    if (canNativeHls) {
      video.muted = true;
      video.volume = 1;
      updateMuteIcon();

      var nativeTimeout = setTimeout(function () {
        setMsg('Il flusso non risponde su questo browser. Riprova.', false, true);

      video.addEventListener('loadedmetadata', function () {
        clearTimeout(nativeTimeout);
        retryCount = 0;
        hideOverlay();
        doPlay();
      }, { once: true });

      video.addEventListener('error', function () {
        clearTimeout(nativeTimeout);
        setMsg('Impossibile avviare la diretta su questo browser. Riprova.', false, true);
        scheduleRetry();
      });

      video.src = STREAM_URL;
      video.load();

    } else if (window.Hls && window.Hls.isSupported()) {
      hls = new Hls({
        lowLatencyMode: true,
        backBufferLength: 90,
        maxBufferLength: 30,
        liveSyncDurationCount: 3,
        enableWorker: true
      });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        retryCount = 0;
        video.muted = true;
        video.volume = 1;
        updateMuteIcon();
        hideOverlay();
        doPlay();
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (!data.fatal) return;
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR: scheduleRetry(); break;
          case Hls.ErrorTypes.MEDIA_ERROR:

          default: scheduleRetry(); break;

    } else {
      setMsg('Il tuo browser non supporta la riproduzione video live.', false, false);

  // Riavviamo lo stream solo se il tempo di riproduzione resta DAVVERO

  var lastTime = -1;
  var stuckTicks = 0;
  var STUCK_THRESHOLD = 4;      // 4 controlli consecutivi fermi...
  var WATCHDOG_INTERVAL = 3000; // ...ogni 3s = 12s di stallo reale prima di riavviare

  setInterval(function () {
    if (video.paused || video.ended) { stuckTicks = 0; lastTime = video.currentTime; return; }

    if (video.currentTime === lastTime) {
      stuckTicks++;
    } else {
      stuckTicks = 0;
    }
    lastTime = video.currentTime;

    if (stuckTicks >= STUCK_THRESHOLD) {
      stuckTicks = 0;
      scheduleRetry();
    }
  }, WATCHDOG_INTERVAL);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && video.paused && hasStarted) {
      doPlay();
    }
  });

  startStream();
